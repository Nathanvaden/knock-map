<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knock Map">
<title>Knock Map</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=25">
</head>
<body>
<!-- Icon set (stroke icons, drawn once and reused) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/></symbol>
  <symbol id="i-plan" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15l2 2 4-4"/></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-nav" viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2-8-8-2Z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M5 16c.6-1.5 1.7-2 3-2s2.4.5 3 2M14 10h5M14 14h3"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H7a5 5 0 1 1 1.1-9.9A6 6 0 0 1 19.6 11 4 4 0 0 1 17.5 19Z"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</svg>

<div id="app">
  <header id="topbar">
    <div class="brand" title="Knock Map"><span class="brand-mark">KM</span></div>
    <label id="searchwrap"><svg class="ico"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search" autocomplete="off"></label>
    <button id="filterBtn" class="topbtn" aria-label="Filters"><svg class="ico"><use href="#i-filter"/></svg><span class="topbtn-label">Filter</span><span id="filterDot" class="dot hidden"></span></button>
    <span id="syncBadge" class="sync off" title="Not connected to cloud backup"><svg class="ico"><use href="#i-cloud"/></svg></span>
  </header>

  <main>
    <section id="view-map" class="view active">
      <div id="map"></div>
      <div id="mapStats"></div>
      <div id="legend"></div>
      <div class="fabs">
        <button id="layerBtn" class="fab small" aria-label="Switch to satellite" title="Satellite / map"><svg class="ico"><use href="#i-layers"/></svg></button>
        <button id="addBtn" class="fab small" aria-label="Add a business" title="Add a business"><svg class="ico"><use href="#i-plus"/></svg></button>
        <button id="locateBtn" class="fab" aria-label="Follow my location" title="Follow my location"><svg class="ico"><use href="#i-locate"/></svg></button>
      </div>
      <div id="placeBanner" class="banner hidden">Move the map so the crosshair sits on the business, then tap <b>Place here</b>.
        <div class="row"><button id="placeCancel" class="btn ghost">Cancel</button><button id="placeOk" class="btn primary">Place here</button></div>
      </div>
      <div id="crosshair" class="hidden">+</div>
    </section>

    <section id="view-list" class="view">
      <div class="listhead">
        <div class="view-title">Nearby</div>
        <select id="sortSel" aria-label="Sort">
          <option value="dist">Closest first</option>
          <option value="name">A to Z</option>
          <option value="recent">Recently visited</option>
        </select>
        <span id="listCount"></span>
      </div>
      <div id="list"></div>
    </section>

    <section id="view-follow" class="view"><div id="follow"></div></section>
    <section id="view-stats" class="view"><div id="stats"></div></section>
    <section id="view-settings" class="view"><div id="settings"></div></section>
  </main>

  <nav id="tabs">
    <button data-view="map" class="active"><svg class="ico"><use href="#i-map"/></svg><span>Map</span></button>
    <button data-view="list"><svg class="ico"><use href="#i-list"/></svg><span>Nearby</span></button>
    <button data-view="follow"><svg class="ico"><use href="#i-plan"/></svg><span>Plan</span><span id="fuCount" class="badge hidden"></span></button>
    <button data-view="stats"><svg class="ico"><use href="#i-stats"/></svg><span>Stats</span></button>
    <button data-view="settings"><svg class="ico"><use href="#i-gear"/></svg><span>Settings</span></button>
  </nav>
</div>

<div id="sheet" class="sheet hidden" aria-hidden="true">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</div>
<div id="modal" class="modal hidden"><div class="modalcard" id="modalBody"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="territory.js?v=25"></script>
<script src="card.js?v=25"></script>
<script src="app.js?v=25"></script>
</body>
</html>
